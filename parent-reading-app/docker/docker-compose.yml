version: '3.8'

# 亲子伴读 App - Docker Compose 部署配置
# 使用: docker-compose up -d

services:
  # ============ 基础设施 ============

  postgres:
    image: postgres:15-alpine
    container_name: pr_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: parent_reading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pr_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============ 应用服务 ============

  ai-service:
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile
    container_name: pr_ai_service
    ports:
      - "8000:8000"
    environment:
      - AI_VOICE_CLONE_ENGINE=${VOICE_CLONE_ENGINE:-cosyvoice}
      - AI_COSYVOICE_API_URL=${COSYVOICE_API_URL:-http://cosyvoice:8080}
      - AI_COSYVOICE_API_KEY=${COSYVOICE_API_KEY:-}
      - AI_FISH_AUDIO_API_KEY=${FISH_AUDIO_API_KEY:-}
      - AI_ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - AI_REDIS_URL=redis://redis:6379/0
      - AI_STORAGE_BACKEND=local
      - AI_LOCAL_STORAGE_PATH=/app/storage
    volumes:
      - ai_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  business-service:
    build:
      context: ../backend/business-service
      dockerfile: Dockerfile
    container_name: pr_business_service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres123}@postgres:5432/parent_reading?schema=public
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - AI_SERVICE_URL=http://ai-service:8000
      - REDIS_URL=redis://redis:6379/1
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - SMS_ACCESS_KEY=${SMS_ACCESS_KEY:-}
      - SMS_SECRET_KEY=${SMS_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  # ============ 反向代理 ============

  nginx:
    image: nginx:alpine
    container_name: pr_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - business-service
      - ai-service
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ai_storage:
