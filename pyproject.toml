[project]
name = "smartdatasource"
version = "1.0.0"
description = "数据源扫描系统 - 扫描、管理和分析金融数据源"
requires-python = ">=3.8"
dependencies = [
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "requests>=2.25.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]

[project.scripts]
dss = "data_source_scanner.cli:main"
smartdatasource = "data_source_scanner.cli:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data_source_scanner", "literature_scanner", "literature_scanner.sources"]
